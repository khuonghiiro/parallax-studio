[package]
name = "parallax-studio"
version = "0.1.0"
description = "Parallax Studio — 2.5D Animation & Filmmaking Desktop App"
authors = ["Parallax Studio Team"]
license = "MIT"
edition = "2021"

[build-dependencies]
tauri-build = { version = "1.5", features = [] }

[dependencies]
tauri = { version = "1.5", features = ["shell-open"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[features]
custom-protocol = ["tauri/custom-protocol"]
