[package]
name = "parallax-engine"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Local animation project engine and deterministic render queue"

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tower-http = { version = "0.6", features = ["fs", "limit"] }
uuid = { version = "1", features = ["v4"] }
base64 = "0.22"
tempfile = "3"
fs2 = "0.4"
png = "0.17"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
